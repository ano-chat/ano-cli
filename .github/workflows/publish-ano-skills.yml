name: Publish ano-skills

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ano-chat/ano-skills tag to publish"
        required: true
        default: "v0.24.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ano-chat/ano-skills
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish @ano-chat/skills
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DOPPLER_TOKEN_STAGING: ${{ secrets.DOPPLER_TOKEN_STAGING }}
          DOPPLER_TOKEN_PRODUCTION: ${{ secrets.DOPPLER_TOKEN_PRODUCTION }}
          REPO_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          tag_version="${INPUT_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag ${INPUT_TAG} does not match package.json version ${package_version}"
            exit 1
          fi

          if npm view "@ano-chat/skills@${package_version}" version >/dev/null 2>&1; then
            echo "@ano-chat/skills@${package_version} is already published; nothing to do."
            exit 0
          fi

          read_doppler_secret() {
            local token="$1"
            local config="$2"
            [[ -n "$token" ]] || return 0
            curl -fsS \
              "https://api.doppler.com/v3/configs/config/secret?project=ano&config=${config}&name=NPM_TOKEN" \
              -H "Authorization: Bearer ${token}" 2>/dev/null |
              node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { try { const d = JSON.parse(s); process.stdout.write(d?.value?.raw ?? ""); } catch {} });'
          }

          npm_token="$(read_doppler_secret "$DOPPLER_TOKEN_STAGING" stg || true)"
          if [[ -n "$npm_token" ]]; then
            echo "Using NPM_TOKEN from Doppler ano/stg."
          else
            echo "NPM_TOKEN not found in Doppler ano/stg."
            npm_token="$(read_doppler_secret "$DOPPLER_TOKEN_PRODUCTION" prd || true)"
            if [[ -n "$npm_token" ]]; then
              echo "Using NPM_TOKEN from Doppler ano/prd."
            fi
          fi

          if [[ -z "$npm_token" ]]; then
            echo "NPM_TOKEN not found in Doppler; using ano-cli repository NPM_TOKEN."
            npm_token="$REPO_NPM_TOKEN"
          fi

          if [[ -z "$npm_token" ]]; then
            echo "::error::No npm token available from Doppler or repository secrets."
            exit 1
          fi

          echo "::add-mask::$npm_token"
          npm config set //registry.npmjs.org/:_authToken "$npm_token"
          npm publish --access public
