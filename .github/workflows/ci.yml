name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:keepalive
      - run: npm run test:cache
      - run: npm run build
      - name: Verify CLI runs
        run: node dist/index.js --help

  # Native-binary smoke. Catches Bun-compat regressions on every PR
  # (e.g., a new dep that uses APIs Bun doesn't support) before they
  # land on main. Doesn't upload artifacts — that's the release job.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run build:native
      - name: Verify native binary runs
        run: |
          ./dist-native/ano-linux-x64 --version
          ./dist-native/ano-linux-x64 --help > /dev/null
