name: Release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # Real-environment gate. Runs the canonical CLI surface against
      # staging (reads + a Zero-mutator write to a test channel)
      # before publishing the tag. Catches: mocks-don't-match-reality
      # bugs (mutator wire shape, registry drift), schema drift between
      # CLI and server, and the "tests pass but runtime breaks" class
      # that mock-based unit tests can't see. The `--expect-endpoint`
      # flag also asserts we're actually hitting staging (not some
      # cached profile drift).
      #
      # The smoke needs an `ano_usr_*` API key bound to a staging
      # workspace. Reads the key from Doppler (project `ano`, config
      # `stg`, secret `ANO_API_KEY_SMOKE`) using the same
      # `DOPPLER_TOKEN_STAGING` GH secret the MIN_CLI_VERSION bump
      # already uses below. Keeps app secrets in one place rather
      # than splitting between Doppler and GH secrets.
      #
      # If `DOPPLER_TOKEN_STAGING` isn't set OR the Doppler fetch
      # fails OR the secret doesn't exist yet, the step warns +
      # skips so the publish isn't blocked while you're provisioning
      # it. Once provisioned in Doppler, EVERY release goes through
      # this gate before users see it.
      - name: Smoke against staging
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          if [[ -z "${DOPPLER_TOKEN:-}" ]]; then
            echo "::warning::DOPPLER_TOKEN_STAGING not set — skipping staging smoke gate. Set the token to enable."
            exit 0
          fi

          # Fetch ANO_API_KEY_SMOKE from Doppler. `value.raw` is the
          # plain string; `value.computed` would be the resolved form
          # (same thing for non-references).
          SMOKE_KEY_JSON=$(curl -fsS \
            "https://api.doppler.com/v3/configs/config/secret?project=ano&config=stg&name=ANO_API_KEY_SMOKE" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" 2>/dev/null || true)
          SMOKE_KEY=$(echo "$SMOKE_KEY_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('value',{}).get('raw','')) if isinstance(d, dict) else print('')" 2>/dev/null || echo "")

          if [[ -z "$SMOKE_KEY" ]]; then
            echo "::warning::ANO_API_KEY_SMOKE not found in Doppler (project=ano, config=stg) — skipping staging smoke gate. To enable: \`doppler secrets set ANO_API_KEY_SMOKE=<ano_usr_…> --project ano --config stg\`"
            exit 0
          fi

          set -e
          echo "Running staging smoke (key from Doppler)..."
          ANO_API_KEY="$SMOKE_KEY" node dist/index.js dev smoke \
            --expect-endpoint https://api-staging.ano.dev \
            --agent | tee /tmp/smoke.json
          # The smoke command exits 1 on any step failure; the pipe +
          # set -e propagates that here. Belt-and-suspenders: also
          # assert ok=true in the JSON envelope so a future smoke
          # regression where ok=false but exit=0 still trips.
          if ! grep -q '"ok": true' /tmp/smoke.json; then
            echo "::error::Smoke reported ok != true — refusing to publish."
            exit 1
          fi
          echo "✓ staging smoke passed; proceeding to npm publish."

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Bump MIN_CLI_VERSION on Ano staging so the in-app upgrade banner
      # fires for any user running below the version we just shipped.
      # The version comes from the tag (`v2.4.0` → `2.4.0`).
      #
      # Requires `DOPPLER_TOKEN_STAGING` secret in the repo with at least
      # `secrets:write` scope on project `ano`, config `stg`. Failure is
      # non-blocking (warn-only) so a missing/expired token never blocks
      # an npm publish — the manual fallback is documented below.
      - name: Bump MIN_CLI_VERSION on staging
        if: ${{ env.DOPPLER_TOKEN != '' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::warning::tag '$GITHUB_REF_NAME' isn't a clean semver — skipping MIN_CLI_VERSION bump."
            exit 0
          fi
          echo "Setting MIN_CLI_VERSION=$VERSION on ano/stg via Doppler API…"
          curl -fsS -X POST \
            "https://api.doppler.com/v3/configs/config/secrets" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"ano\",\"config\":\"stg\",\"secrets\":{\"MIN_CLI_VERSION\":\"${VERSION}\"}}" \
            || {
              echo "::warning::Doppler bump failed — set MIN_CLI_VERSION manually:"
              echo "::warning::  doppler secrets set MIN_CLI_VERSION=$VERSION --project ano --config stg"
              exit 0
            }
          echo "✓ MIN_CLI_VERSION=$VERSION set on ano/stg."

      # Production bump runs the same way on the `prd` config. Gated
      # behind a separate token so the staging bump can fail without
      # affecting prod, and so prod requires its own approval flow.
      - name: Bump MIN_CLI_VERSION on production
        if: ${{ env.DOPPLER_TOKEN != '' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRODUCTION }}
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::warning::tag '$GITHUB_REF_NAME' isn't a clean semver — skipping prod bump."
            exit 0
          fi
          echo "Setting MIN_CLI_VERSION=$VERSION on ano/prd via Doppler API…"
          curl -fsS -X POST \
            "https://api.doppler.com/v3/configs/config/secrets" \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"ano\",\"config\":\"prd\",\"secrets\":{\"MIN_CLI_VERSION\":\"${VERSION}\"}}" \
            || {
              echo "::warning::Doppler prod bump failed — set MIN_CLI_VERSION manually:"
              echo "::warning::  doppler secrets set MIN_CLI_VERSION=$VERSION --project ano --config prd"
              exit 0
            }
          echo "✓ MIN_CLI_VERSION=$VERSION set on ano/prd."

  # Native binaries are an opt-in fast-path distribution (~20 ms cold
  # start vs ~90 ms via npm/node). Compiled with Bun and attached to
  # the GitHub Release alongside the tag. The npm `publish` job above
  # is still the primary distribution and gates this one — if publish
  # fails for any reason, no native binaries get shipped either.
  #
  # Single Linux runner cross-compiles all four targets. Bun supports
  # this via `--target=bun-<os>-<arch>` without needing per-platform
  # runners.
  native:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run build:native
      # The release workflow has historically only published to npm —
      # no GitHub Release was created for prior tags (v2.20.0 has no
      # release page). `gh release upload` requires an existing release,
      # so we ensure one exists first. `--generate-notes` autopopulates
      # the body from commits since the previous tag. Idempotent via
      # `||` fallback so re-running this job against an already-created
      # release just moves to the upload step.
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; will upload binaries to it."
          else
            echo "Creating Release $GITHUB_REF_NAME with auto-generated notes…"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist-native/ano-darwin-arm64 \
            dist-native/ano-darwin-x64 \
            dist-native/ano-linux-x64 \
            dist-native/ano-linux-arm64 \
            dist-native/SHA256SUMS \
            --clobber
